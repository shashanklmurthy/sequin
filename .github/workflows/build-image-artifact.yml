name: Build image artifact (native, no push)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Value for the RELEASE_VERSION build-arg
        required: false
        default: manual-build

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image natively (no emulation)
        run: |
          docker build \
            --build-arg SELF_HOSTED=1 \
            --build-arg RELEASE_VERSION="${{ inputs.release_version }}" \
            -t sequin-build:${{ matrix.arch }} \
            .
          docker save sequin-build:${{ matrix.arch }} -o sequin-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: sequin-image-${{ matrix.arch }}
          path: sequin-${{ matrix.arch }}.tar
          retention-days: 1
