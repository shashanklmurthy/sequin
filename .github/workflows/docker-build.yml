name: Docker Build

# Builds linux/amd64 and linux/arm64 images on GitHub-hosted runners and
# uploads each one as a workflow artifact (a gzipped `docker save` tarball).
# Nothing is pushed to a registry from CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
      retention_days:
        description: 'Days to keep the image artifacts'
        required: false
        default: '7'
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        type: string
        required: true
      retention_days:
        description: 'Days to keep the image artifacts'
        type: string
        required: false
        default: '7'

jobs:
  docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # Native arm64 runner; building arm64 under QEMU on ubuntu-latest is far too slow
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            SELF_HOSTED=1
            RELEASE_VERSION=${{ inputs.version }}
            SENTRY_DSN=${{ secrets.SELF_HOSTED_SENTRY_DSN }}
          tags: |
            sequin/sequin:${{ inputs.version }}-${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/sequin-${{ inputs.version }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false

      - name: Compress image
        run: gzip -1 "$RUNNER_TEMP/sequin-${VERSION}-${ARCH}.tar"
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}

      - name: Upload image artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sequin-image-${{ inputs.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sequin-${{ inputs.version }}-${{ matrix.arch }}.tar.gz
          retention-days: ${{ inputs.retention_days }}
          # Already gzipped
          compression-level: 0
          if-no-files-found: error

      - name: Publish download link
        run: |
          {
            echo "### sequin/sequin:${VERSION}-${ARCH}"
            echo ""
            echo "Download: ${ARTIFACT_URL}"
            echo ""
            echo "Artifact ID: \`${ARTIFACT_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Image artifact (${ARCH})::${ARTIFACT_URL}"
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}

  smoke-test:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AMD64 image artifact
        uses: actions/download-artifact@v4
        with:
          name: sequin-image-${{ inputs.version }}-amd64
          path: ${{ runner.temp }}/image

      - name: Load AMD64 image
        run: gunzip -c "$RUNNER_TEMP/image/sequin-${VERSION}-amd64.tar.gz" | docker load
        env:
          VERSION: ${{ inputs.version }}

      - name: Test AMD64 image
        env:
          IMAGE_VERSION: ${{ inputs.version }}-amd64
        run: .github/workflows/docker-smoke.sh

  links:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Summarize artifact links
        run: |
          {
            echo "## Image artifacts"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
